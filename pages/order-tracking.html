<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Delivery Progress | Northstar</title><link rel="stylesheet" href="../css/styles.css"><script src="../data/demo-data.js"></script><script src="../js/app.js"></script></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span class="brand-mark">N</span><span>Northstar Retail Co.</span></a><nav><a href="../index.html">Home</a><a class="active" href="order-status.html">Order Status</a><a href="returns.html">Returns &amp; Refunds</a><a href="stock.html">Stock Availability</a><a href="human-support.html">Human Support</a></nav></div></header>
<main><section class="page-head"><div class="container"><div class="breadcrumb">Home / Order Status / Delivery Progress</div><h1>Delivery Progress</h1><p class="lead">A clear demonstration view of the current delivery stage.</p></div></section>
<section class="container section"><div id="tracking"></div></section></main>
<footer class="site-footer"><div class="container">Demonstration prototype only. No live carrier or GPS data is connected.</div></footer>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const p=new URLSearchParams(location.search);const no=p.get("order")||localStorage.getItem("nsOrder")||"NS1001";const o=NORTHSTAR_DEMO.orders[no];
 const el=qs("#tracking");
 if(!o){el.innerHTML='<div class="alert">The demonstration order could not be found. <a href="order-status.html">Check another order</a>.</div>';return;}
 el.innerHTML=`<div class="panel"><p class="eyebrow">Order ${esc(no)}</p><h2>${esc(o.item)}</h2>
 <div class="kpi-grid"><div class="kpi"><span class="meta">Current status</span><strong>${esc(o.status)}</strong></div><div class="kpi"><span class="meta">Driver status</span><strong>${esc(o.driverStatus)}</strong></div><div class="kpi"><span class="meta">Estimated delivery</span><strong>${esc(o.estimatedDelivery)}</strong></div></div>
 <div class="timeline">
 <div class="timeline-item"><span class="dot done"></span><div><strong>Order processed</strong><div class="meta">Completed in demonstration system.</div></div></div>
 <div class="timeline-item"><span class="dot done"></span><div><strong>Order shipped</strong><div class="meta">Shipment entered delivery network.</div></div></div>
 <div class="timeline-item"><span class="dot current"></span><div><strong>${esc(o.driverStatus)}</strong><div class="meta">Current demonstration status.</div></div></div>
 <div class="timeline-item"><span class="dot"></span><div><strong>Estimated delivery</strong><div class="meta">${esc(o.estimatedDelivery)}</div></div></div>
 </div>
 <div class="notice"><strong>Why only an estimated date?</strong><br>${esc(NORTHSTAR_DEMO.policy.standardDeliveryExplanation)}</div>
 <p class="muted">Live driver location is not available in this demonstration prototype. The driver status above is simulated.</p>
 <div class="actions"><a class="button" href="returns.html?order=${encodeURIComponent(no)}">Start a Return</a><a class="button secondary" href="order-status.html">Check Another Order</a><a class="button secondary" href="human-support.html?order=${encodeURIComponent(no)}">Report a Delivery Problem</a></div>
 </div>`;
});
</script>
</body></html>
