<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Available Alternatives | Northstar</title><link rel="stylesheet" href="../css/styles.css"><script src="../data/demo-data.js"></script><script src="../js/app.js"></script></head>
<body>
<header class="site-header"><div class="container header-inner"><a class="brand" href="../index.html"><span class="brand-mark">N</span><span>Northstar Retail Co.</span></a><nav><a href="../index.html">Home</a><a href="order-status.html">Order Status</a><a href="returns.html">Returns &amp; Refunds</a><a class="active" href="stock.html">Stock Availability</a><a href="human-support.html">Human Support</a></nav></div></header>
<main><section class="page-head"><div class="container"><div class="breadcrumb">Stock Availability / Alternatives</div><h1>Available Alternatives</h1><p class="lead">The requested option is unavailable, so here are other demonstration options you can consider.</p></div></section>
<section class="container section"><div id="alternatives"></div></section></main>
<footer class="site-footer"><div class="container">Alternative inventory is simulated demonstration data.</div></footer>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 const p=new URLSearchParams(location.search),product=p.get("product")||"Northstar Runner",size=p.get("size")||"Large",el=qs("#alternatives");
 const rows=[];
 Object.entries(NORTHSTAR_DEMO.inventory).forEach(([prod,sizes])=>Object.entries(sizes).forEach(([sz,status])=>{
   if(status!=="Out of Stock" && !(prod===product && sz===size)) rows.push({prod,sz,status});
 }));
 rows.sort((a,b)=>(a.status==="In Stock"?0:1)-(b.status==="In Stock"?0:1));
 const list=rows.slice(0,6).map(x=>`<tr><td><strong>${esc(x.prod)}</strong></td><td>${esc(x.sz)}</td><td><span class="status ${x.status==="In Stock"?"in":"low"}">${esc(x.status)}</span></td><td><a class="button secondary" href="stock.html">Check this option</a></td></tr>`).join("");
 el.innerHTML=`<div class="notice"><strong>${esc(product)} — ${esc(size)}</strong> is unavailable in the demonstration inventory. You can choose another available size or product.</div>
 <div class="panel"><table class="table"><thead><tr><th>Product</th><th>Size</th><th>Availability</th><th>Action</th></tr></thead><tbody>${list}</tbody></table>
 <div class="actions"><a class="button" href="notification.html?product=${encodeURIComponent(product)}&size=${encodeURIComponent(size)}">Request Stock Notification</a><a class="button secondary" href="stock.html">Check Another Product</a></div></div>`;
});
</script>
</body></html>
